<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Reserva tu cita en Studio Soul Sisters: maquillaje, peinado, uñas, rostro y podología.">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Citas Soul Sisters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: ficha de salón estilo marketplace (hero con mosaico, índice de secciones fijo, servicios por categoría,
   equipo, horarios, tarjeta lateral fija) y un flujo de reserva en pantalla completa con resumen y barra inferior.
   Marca provisional rosa / ciruela / dorado: ajusta los tokens de :root con la identidad final. */
:root{
  --bg:#fbf4f2; --surface:#ffffff; --ink:#2a1620; --muted:#7d6670; --line:#eedcd9; --soft:#f6e8e6;
  --rose:#b3395b; --rose-ink:#ffffff; --blush:#f4dcdf; --gold:#a9823a;
  --ok:#2f7a55; --warn:#a56a12; --bad:#b0342a;
  --sh:0 1px 2px rgba(60,20,35,.06),0 8px 24px rgba(60,20,35,.07);
  --display:'Bodoni Moda','Didot',Georgia,serif; --body:'Jost','Helvetica Neue',Arial,sans-serif; --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1016; --surface:#25171e; --ink:#f7e9e6; --muted:#b79da6; --line:#3b2832; --soft:#2f1e27;
  --rose:#e07a98; --rose-ink:#2a1620; --blush:#3a222c; --gold:#d3ae67; --ok:#6fcf9b; --warn:#e5b25d; --bad:#f08a80;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1a1016; --surface:#25171e; --ink:#f7e9e6; --muted:#b79da6; --line:#3b2832; --soft:#2f1e27;
  --rose:#e07a98; --rose-ink:#2a1620; --blush:#3a222c; --gold:#d3ae67; --ok:#6fcf9b; --warn:#e5b25d; --bad:#f08a80;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.brand small{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:500}
.brand b{font-family:var(--display);font-style:italic;font-weight:500;font-size:25px}
.topr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill-nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:99px}
.pill-nav button{border:0;background:none;padding:7px 16px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.pill-nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who img{width:30px;height:30px;border-radius:50%}
.who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.badge{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:2px 8px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:stretch;margin:6px 0 22px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--display);font-size:clamp(34px,6vw,56px);line-height:1.04;margin:8px 0 14px}
.hero h1 em{color:var(--rose)}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.mosaic{display:grid;grid-template-columns:1.1fr .9fr;grid-template-rows:1fr 1fr;gap:10px;min-height:260px}
.mosaic>div{border-radius:20px;position:relative;overflow:hidden}
.m1{grid-row:1/3;background:linear-gradient(170deg,var(--rose),var(--gold) 120%);border-radius:999px 999px 20px 20px!important}
.m1::after{content:"SS";position:absolute;inset:auto 0 18px;text-align:center;font-family:var(--display);font-style:italic;font-size:44px;color:var(--rose-ink);opacity:.9}
.m2{background:var(--blush);display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:center;padding:12px}
.m2 i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.m3{background:var(--soft);display:grid;place-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;padding:10px}
/* anchors */
.anchors{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:6px}
.anchors .al{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.anchors .al button{border:0;background:none;cursor:pointer;padding:12px 14px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.anchors .al button:hover{color:var(--ink)}
.sec{margin-block:56px;scroll-margin-top:64px}
.sec>h2{font-family:var(--display);font-size:28px;margin-bottom:14px}
.about{color:var(--muted);max-width:62ch;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{margin-bottom:20px}
.cat h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:var(--body);font-weight:500}
.svc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;transition:box-shadow .15s,border-color .15s}
.svc-row:hover{box-shadow:var(--sh);border-color:var(--blush)}
.svc-row b{font-weight:500}.svc-row small{color:var(--muted);display:block;font-size:13px}
.svc-row .pr{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.svc-row .pr .btn{margin-top:4px}
@media(max-width:520px){.svc-row{grid-template-columns:auto minmax(0,1fr)}.svc-row .pr{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:center;justify-content:space-between}.svc-row .pr .btn{margin:0}}
.sth{width:68px;height:68px;border-radius:12px;object-fit:cover;object-position:center 30%;background:var(--blush);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:22px;color:var(--rose);flex:none}
.sth.sm{width:46px;height:46px;border-radius:10px;font-size:16px}
.featgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transition:box-shadow .2s,transform .2s}
.fc:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.fc .ph{position:relative;aspect-ratio:4/5;background:var(--blush);overflow:hidden}
.fc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fc .tagn{position:absolute;top:12px;left:12px;background:var(--rose);color:var(--rose-ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.fc .tx{padding:14px 16px 16px;display:grid;gap:6px;align-content:start}
.fc h3{font-family:var(--display);font-size:20px}
.fc p{margin:0;color:var(--muted);font-size:13.5px}
.fc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:14px}
.fc .ft b{font-weight:500}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.how i{font-style:normal;font-family:var(--display);font-size:30px;color:var(--rose);display:block;line-height:1}
.how b{display:block;font-weight:500;margin:8px 0 2px}.how span{color:var(--muted);font-size:14px}
.quote{background:var(--blush);border-radius:20px;padding:30px 28px;text-align:center}
.quote blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(22px,3.4vw,32px);line-height:1.25;text-wrap:balance}
.quote small{display:block;margin-top:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:11.5px}
.insta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.insta b{font-family:var(--display);font-size:22px;font-weight:500;display:block}.insta span{color:var(--muted);font-size:14px}
.foot{border-top:1px solid var(--line);margin-top:20px;padding-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;color:var(--muted);font-size:14px}
.foot b{display:block;color:var(--ink);font-family:var(--display);font-size:20px;font-weight:500;margin-bottom:6px}
.foot a{color:var(--rose);text-decoration:none;display:block;margin-top:4px}
.m1.ph,.m3.ph{background-size:cover;background-repeat:no-repeat}
.m3.ph{color:transparent}
.m1.ph::after{display:none}
.pick.p4{grid-template-columns:auto auto minmax(0,1fr) auto}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center;display:grid;gap:2px;justify-items:center}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:24px;color:#fff;margin-bottom:6px}
.mem b{font-weight:500}.mem small{color:var(--muted);font-size:12.5px;min-height:19px}
.mem .btn{margin-top:8px}
.hrs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.hrs div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hrs div:first-child{border-top:0}.hrs span:first-child{text-transform:capitalize}.hrs .cl{color:var(--muted)}
.hrs .tdy{font-weight:600}
.side{position:sticky;top:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.card h3{font-family:var(--display);font-size:24px;margin-bottom:6px}
.card .meta{margin:0 0 14px}
.card .btn{width:100%;margin-top:8px;text-align:center;text-decoration:none;display:block}
.trust{display:grid;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
/* generic */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 20px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 14px;font-size:13px}.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{padding:13px 26px;font-size:16px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.panel h2{font-family:var(--display);font-size:24px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.empty{color:var(--muted);padding:14px 0;font-size:14px}
.msg{padding:12px 16px;border-radius:12px;background:var(--blush);margin-bottom:16px;font-size:14px}
.msg.bad{color:var(--bad);border:1px solid var(--bad);background:transparent}
.chip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip.pendiente{color:var(--warn)}.chip.confirmada{color:var(--ok)}.chip.cancelada{color:var(--bad)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .when{font-family:var(--display);font-size:22px;line-height:1.1;min-width:64px;font-variant-numeric:tabular-nums}
.item .when small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);text-transform:capitalize}
.item .what{min-width:0}.item .what b{font-weight:500}.item .what div{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media(max-width:560px){.item{grid-template-columns:auto minmax(0,1fr)}.item .acts{grid-column:1/-1;justify-content:flex-start}}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 16px;cursor:pointer;font-size:14px}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 6px;color:var(--muted);font-size:13px}
.stats b{display:block;font-family:var(--display);font-size:28px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.daynav{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.dow{display:flex;gap:6px;flex-wrap:wrap}
.dow label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.rg{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rg .d{min-width:130px;font-weight:500;text-transform:capitalize}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--blush);border-radius:99px;padding:3px 6px 3px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.tag button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;max-width:90vw}
.skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;margin-bottom:8px}
@media(prefers-reduced-motion:no-preference){.skel{animation:sk 1.4s linear infinite}@keyframes sk{to{background-position:-200% 0}}
  .fl-body>div{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
.mbar{display:none}
@media(max-width:900px){.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;align-items:center;justify-content:space-between}
  body{padding-bottom:84px}}
/* flujo de reserva */
#flow{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.fl-head{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.fl-head .x{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.fl-head .t{min-width:0;flex:1}.fl-head .t b{display:block;font-family:var(--display);font-size:18px;font-weight:500}
.fl-head .t span{font-size:12.5px;color:var(--muted)}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--rose);transition:width .25s}
.fl-main{flex:1;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.fl-grid{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
@media(max-width:860px){.fl-grid{grid-template-columns:minmax(0,1fr)}.fl-sum{display:none}}
.fl-body h2{font-family:var(--display);font-size:30px;margin-bottom:6px}
.fl-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fl-foot>div{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fl-foot .tt small{display:block;color:var(--muted);font-size:12px}.fl-foot .tt b{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;cursor:pointer}
.pick:hover{border-color:var(--rose)}
.pick[aria-pressed="true"]{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose) inset;background:var(--blush)}
.pick .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--rose-ink)}
.pick[aria-pressed="true"] .ck{background:var(--rose);border-color:var(--rose)}
.pick .nm{min-width:0}.pick .nm small{display:block;color:var(--muted);font-size:13px}
.pick .pr{font-weight:500;font-variant-numeric:tabular-nums}
.pick .av{width:44px;height:44px;font-size:17px;margin:0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-family:var(--display);font-size:20px;font-weight:500;text-transform:capitalize}
.cal-h button{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:50%;cursor:pointer}
.cal-h button:disabled{opacity:.35;cursor:not-allowed}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-g .wd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.cal-g button{aspect-ratio:1;border:0;border-radius:50%;background:none;cursor:pointer;font-variant-numeric:tabular-nums;font-size:14px}
.cal-g button.av-d{background:var(--blush);font-weight:600}
.cal-g button.av-d:hover{outline:2px solid var(--rose)}
.cal-g button[aria-pressed="true"]{background:var(--rose);color:var(--rose-ink)}
.cal-g button:disabled{color:var(--muted);opacity:.4;cursor:default}
.part{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

  services:[],staff:[],ranges:[],busy:[],config:{},mine:null,all:[],cat:'Todos',gallery:[],reviews:[],leads:[],myLead:null,assets:null,packs:[],q:'',hero:null,vouchers:[],hi:0,hpause:false,heroSig:'',local:false,loginOpen:false,afterLogin:null,confirmReset:false,

function merge(rs){const iv=rs.map(r=>[tm(r.start),tm(r.end)]).sort((a,b)=>a[0]-b[0]),o=[];

  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),m=merge(S.ranges.filter(r=>r.date===today));

  for(let i=0;i<60;i++){const dt=new Date();dt.setDate(dt.getDate()+i);const w=dt.getDay(),date=ymd(dt);

function makeLocalDb(){
  let data=lget(LKEY);const sd=seedData();
  if(!data)data=sd;
  else if(data.__v!==2){data.config=data.config||{};if(!data.config.hero)data.config.hero=sd.config.hero;
    if(!Object.keys(data.gallery||{}).length)data.gallery=sd.gallery;if(!Object.keys(data.vouchers||{}).length)data.vouchers=sd.vouchers;data.__v=2}
  lset(LKEY,data);
  const subs=new Set(),clone=v=>JSON.parse(JSON.stringify(v));
  const docs=c=>Object.entries(data[c]||{}).map(([id,v])=>({id,data:()=>clone(v)}));
  const persist=()=>{lset(LKEY,data);setTimeout(()=>subs.forEach(f=>f()),0)};
  const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
  const mkdoc=p=>{const[c,id]=split(p);return{
    set:async v=>{(data[c]=data[c]||{})[id]=clone(v);persist()},
    update:async v=>{const d=(data[c]=data[c]||{});d[id]={...(d[id]||{}),...clone(v)};persist()},
    delete:async()=>{if(data[c])delete data[c][id];persist()},
    onSnapshot:cb=>{const f=()=>{const v=(data[c]||{})[id];cb({exists:v!==undefined,data:()=>v&&clone(v)})};subs.add(f);f();return()=>subs.delete(f)}}};
  const mkcol=c=>({
    onSnapshot:cb=>{const f=()=>cb({docs:docs(c)});subs.add(f);f();return()=>subs.delete(f)},
    add:async v=>{const id=c.slice(0,2)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);(data[c]=data[c]||{})[id]=clone(v);persist();return{id}},
    where:(f,op,val)=>({get:async()=>({docs:docs(c).filter(d=>d.data()[f]===val)})})});
  window.addEventListener('storage',e=>{if(e.key===LKEY){const n=lget(LKEY);if(n){data=n;subs.forEach(f=>f())}}});
  return{doc:mkdoc,collection:mkcol};
}
function localAssets(){return{
  upload:b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const id='a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    ASSETS[id]=r.result;const m=lget(AKEY)||{};m[id]=r.result;if(!lset(AKEY,m)){delete ASSETS[id];rej(new Error('quota'));return}res({id})};r.onerror=()=>rej(r.error);r.readAsDataURL(b)}),
  delete:async id=>{delete ASSETS[id];const m=lget(AKEY)||{};delete m[id];lset(AKEY,m)}}}

function loginView(){
  const nm=h('input',{id:'lg-name',type:'text',autocomplete:'name'}),ph=h('input',{id:'lg-phone',type:'tel',autocomplete:'tel',placeholder:'999 999 999'}),pin=h('input',{id:'lg-pin',type:'password',autocomplete:'off'});
  const phBox=h('label',{class:'f'},'WhatsApp',ph),pinBox=h('label',{class:'f'},'PIN del salón',pin);pinBox.hidden=true;
  const tg=h('button',{class:'btn sm',id:'lg-toggle',type:'button'},'Soy parte del salón');
  tg.addEventListener('click',()=>{pinBox.hidden=!pinBox.hidden;phBox.hidden=!pinBox.hidden;tg.textContent=pinBox.hidden?'Soy parte del salón':'Soy clienta'});
  const go=()=>{
    const name=nm.value.trim(),phone=ph.value.replace(/\D/g,'');
    if(!pinBox.hidden){if(pin.value!==ADMIN_PIN){toast('PIN incorrecto.');return}startSession({uid:'u_salon',name:name||'Salón',admin:true,phone:''});return}
    if(name.length<2||phone.length<7){toast('Escribe tu nombre y un WhatsApp válido.');return}
    startSession({uid:'u_'+phone,name,admin:false,phone:ph.value.trim()});
  };
  [nm,ph,pin].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  return[h('div',{class:'fl-head'},h('button',{class:'x','aria-label':'Cerrar',onclick:()=>{S.loginOpen=false;S.afterLogin=null;render()}},'×'),
      h('div',{class:'t'},h('b',{},'Ingresar'),h('span',{},'Studio Soul Sisters'))),
    h('div',{class:'fl-main'},h('div',{class:'done'},h('h2',{},'Tus citas a tu nombre'),

      h('div',{class:'row'},h('label',{class:'f'},'Nombre completo',nm),phBox),pinBox,
      h('div',{class:'actions',style:'display:flex;gap:10px;flex-wrap:wrap;margin-top:18px'},h('button',{class:'btn primary lg',id:'lg-go',onclick:go},'Entrar'),tg)))];
}
function startSession(ss){
  lset(SKEY,ss);S.uid=ss.uid;S.isAdmin=!!ss.admin;S.me={id:ss.uid,name:ss.name,avatarUrl:avatar(ss.name)};
  if(!ss.admin){S.sel.name=ss.name;S.sel.phone=ss.phone||''}
  S.loginOpen=false;startUser();render();
  if(S.afterLogin){const f=S.afterLogin;S.afterLogin=null;f()}
}
function logout(){lrm(SKEY);location.reload()}
function exportCsv(){
  const rows=[['Fecha','Hora','Clienta','WhatsApp','Servicio','Profesional','Estado','Precio']];
  flat().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).forEach(i=>rows.push([i.date,i.start,i.clientName,i.phone,i.serviceName,i.staffName,i.status,i.price||0]));
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='citas-soul-sisters.csv';document.body.append(a);a.click();a.remove();
}
function localPanel(){
  return h('div',{class:'panel'},h('h2',{},'Modo demostración'),
    h('p',{class:'sub'},'Las citas, servicios y fotos se guardan solo en este navegador. Para atender clientas reales desde varios dispositivos se necesita un servidor.'),
    h('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},h('button',{class:'btn',onclick:exportCsv},'Descargar citas (CSV)'),
      S.confirmReset?[h('button',{class:'btn danger',onclick:()=>{lrm(LKEY);lrm(AKEY);location.reload()}},'Sí, borrar todo'),h('button',{class:'btn',onclick:()=>{S.confirmReset=false;render()}},'Cancelar')]
        :h('button',{class:'btn',onclick:()=>{S.confirmReset=true;render()}},'Restablecer datos de ejemplo')),
    h('p',{class:'note'},'El PIN del salón se cambia en la constante ADMIN_PIN del código. Está visible en el archivo, así que no protege datos sensibles.'));
}

/* ---------- arranque ---------- */
let userStarted=false;
function startPublic(){
  setTimeout(()=>{if(!S.loaded.services){S.late=true;sched()}},10000);
  const ord=(a,b)=>(a.order||0)-(b.order||0);
  sub('services','services',ord);sub('staff','staff',ord);sub('ranges','ranges');sub('busy','busy');sub('gallery','gallery',ord);sub('reviews','reviews',ord);sub('packs','packs',ord);sub('vouchers','vouchers',ord);
  S.db.doc('config/salon').onSnapshot(d=>{S.config=d.exists?d.data():{};S.form.wa=null;S.form.dep=null;S.form.about=null;S.form.addr=null;S.form.wp=null;S.form.br=null;S.form.em=null;sched()},()=>{});
  S.db.doc('config/hero').onSnapshot(d=>{S.hero=d.exists?d.data():null;S.form.hs=null;sched()},()=>{});
}
function startUser(){
  if(userStarted||!S.db||!S.uid)return;userStarted=true;
  S.db.doc('bookings/'+S.uid).onSnapshot(d=>{S.mine=d.exists?d.data():null;sched()},e=>{S.err=e.code;sched()});
  S.db.doc('leads/'+S.uid).onSnapshot(d=>{S.myLead=d.exists?d.data():null;sched()},()=>{});
  if(S.isAdmin){sub('bookings','all');sub('leads','leads')}
}
(async function boot(){
  heroAuto();
  try{
    const c=window.claude;
    if(!c||!c.use){
      Object.assign(ASSETS,SEED_IMGS,lget(AKEY)||{});
      S.local=true;S.db=makeLocalDb();S.assets=localAssets();
      const ss=lget(SKEY);
      if(ss&&ss.uid){S.uid=ss.uid;S.isAdmin=!!ss.admin;S.me={id:ss.uid,name:ss.name,avatarUrl:avatar(ss.name)};if(!ss.admin){S.sel.name=ss.name;S.sel.phone=ss.phone||''}}
      render();startPublic();startUser();return;
    }
    render();
    S.user=await c.use('user');S.db=await c.use('db');S.assets=await c.use('assets');
    if(S.user){S.me=await S.user.me();S.uid=S.me.id;S.isAdmin=await S.user.canEdit()}
    render();if(!S.db||!S.uid)return;
    startPublic();startUser();
  }catch(e){S.err='error';render()}
})();
})();
</script>
</body></html>
